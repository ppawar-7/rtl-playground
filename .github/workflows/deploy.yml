name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pre-deploy-check:
    name: Pre-Deployment Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Verification Dependencies
        run: npm install

      - name: Run RTL Fundamentals Unit Tests
        run: npm test

      - name: Run Advanced RTL Lab Tests
        run: npm run test:advanced

      - name: Run YoWASP Yosys Synthesis Verification
        run: npm run test:yosys

      - name: Run Icarus Verilog Simulation Verification
        run: npm run test:iverilog

      - name: Run Differential Parity Verification
        run: npm run test:differential

      - name: Run GitHub Pages Subpath Audit (/rtl-playground/)
        run: npm run test:subpath

  deploy:
    name: Deploy to GitHub Pages
    needs: pre-deploy-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
