name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Pre-Deployment Verification & Artifact Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Verification Dependencies
        run: npm ci

      - name: Run RTL Fundamentals Unit Tests
        run: npm test

      - name: Run Advanced RTL Lab Tests
        run: npm run test:advanced

      - name: Run YoWASP Yosys Synthesis Verification
        run: npm run test:yosys

      - name: Run Icarus Verilog Simulation Verification
        run: npm run test:iverilog

      - name: Run Differential Parity Verification
        run: npm run test:differential

      - name: Build Static Site Packaging Artifact (_site)
        run: npm run build

      - name: Run GitHub Pages Subpath Audit on Packaged Artifact (_site)
        run: SITE_ROOT=_site npm run test:subpath

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Clean Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Verified Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
