<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTL Playground — Interactive RTL Design Learning Platform</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <div id="app-container">
        <!-- Top App Header -->
        <header id="app-header">
            <div class="brand-section">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="4" />
                        <line x1="7" y1="12" x2="11" y2="12" />
                        <polyline points="11,8 15,12 11,16" />
                    </svg>
                    <span>RTL Playground</span>
                </div>
                <span class="brand-badge">PD Playground Suite</span>
            </div>

            <div class="header-toolbar">
                <label for="preset-select" style="font-size:11px; color:var(--text-muted); font-weight:600;">PRESETS:</label>
                <select id="preset-select" class="form-select">
                    <option value="" disabled selected>Load Example Circuit...</option>
                    <option value="and-gate">2-Input AND Gate</option>
                    <option value="or-gate">2-Input OR Gate</option>
                    <option value="not-gate">1-Bit Inverter (NOT)</option>
                    <option value="half-adder">1-Bit Half Adder</option>
                    <option value="mux-2to1">2:1 Multiplexer</option>
                    <option value="dff-demo">D Flip-Flop Register Demo</option>
                </select>

                <button id="btn-reset-circuit" class="btn btn-sm" title="Clear all components and reset">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                    <span>Reset Canvas</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace Area -->
        <main id="main-workspace">
            <!-- Left Sidebar: Palette & Lessons -->
            <aside id="left-panel" class="panel">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab-btn active" data-tab="palette">Palette</button>
                    <button class="sidebar-tab-btn" data-tab="lessons">Lessons</button>
                </div>
                <div class="panel-content">
                    <div id="palette-container"></div>
                    <div id="lessons-container" style="display:none;"></div>
                </div>
            </aside>

            <!-- Center Panel: SVG Circuit Canvas -->
            <section id="center-panel">
                <div class="canvas-toolbar">
                    <button id="btn-canvas-clear" class="btn btn-sm btn-danger" title="Clear entire circuit">
                        <span>Clear All</span>
                    </button>
                </div>

                <div id="circuit-canvas-container">
                    <svg id="circuit-svg"></svg>
                </div>

                <div class="canvas-status-bar">
                    <span id="canvas-status-text">Ready — Drag gates onto canvas & connect pins</span>
                </div>
            </section>

            <!-- Right Inspector Panel -->
            <aside id="right-panel" class="panel">
                <div class="panel-header">
                    <div class="title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="9" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        <span>Circuit Inspector</span>
                    </div>
                </div>
                <div class="panel-content" id="inspector-content">
                    <!-- Populated dynamically by PanelManager -->
                </div>
            </aside>
        </main>

        <!-- Bottom Drawer: Verilog, Truth Table, Waveforms -->
        <section id="bottom-panel">
            <div class="drawer-tabs">
                <button class="drawer-tab-btn active" data-tab="verilog">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6" />
                        <polyline points="8 6 2 12 8 18" />
                    </svg>
                    <span>Generated Verilog</span>
                </button>
                <button class="drawer-tab-btn" data-tab="truth-table">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="9" y1="21" x2="9" y2="9" />
                    </svg>
                    <span>Truth Table</span>
                </button>
                <button class="drawer-tab-btn" data-tab="waveform">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M 2 18 L 6 18 L 6 6 L 12 6 L 12 18 L 18 18 L 18 6 L 22 6" />
                    </svg>
                    <span>Waveform Viewer</span>
                </button>
            </div>

            <div class="drawer-content">
                <!-- Verilog Pane -->
                <div id="tab-verilog" class="tab-pane active">
                    <div class="verilog-container">
                        <div class="verilog-header">
                            <span style="font-size:11px; color:var(--text-muted); font-family:var(--font-mono);">
                                Synthesizable IEEE 1364-2001 Verilog HDL
                            </span>
                            <button id="copy-verilog-btn" class="btn btn-sm btn-primary">
                                Copy Verilog
                            </button>
                        </div>
                        <pre class="verilog-code"><code id="verilog-code-display">// Add components and wire connections to generate synthesizable Verilog</code></pre>
                    </div>
                </div>

                <!-- Truth Table Pane -->
                <div id="tab-truth-table" class="tab-pane">
                    <div id="truth-table-view"></div>
                </div>

                <!-- Waveform Pane -->
                <div id="tab-waveform" class="tab-pane">
                    <div id="waveform-view"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Application Script (ES Module) -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
