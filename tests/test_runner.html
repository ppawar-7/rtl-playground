<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTL Playground — In-Browser Automated Test Runner</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --color-pass: #22c55e;
            --color-fail: #ef4444;
            --color-accent: #38bdf8;
            --border: #334155;
            --font-mono: 'Cascadia Code', Consolas, monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--color-accent);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-running {
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--color-accent);
        }

        .badge-pass {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--color-pass);
        }

        .badge-fail {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--color-fail);
        }

        .summary-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .stat-val {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .log-box {
            background-color: #090d16;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 540px;
            overflow-y: auto;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>RTL Playground — Test Suite</h1>
                <p style="margin:4px 0 0; font-size:12px; color:var(--text-dim);">
                    Verification of Gate Truth Tables, Propagation, DFF Edge-Triggering, Waveforms & Verilog Generation
                </p>
            </div>
            <div id="status-indicator" class="status-badge badge-running">Running...</div>
        </header>

        <div class="summary-card">
            <div class="stat-item">
                <span class="stat-label">Total Tests</span>
                <span id="stat-total" class="stat-val">26</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Passed</span>
                <span id="stat-passed" class="stat-val" style="color:var(--color-pass);">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Failed</span>
                <span id="stat-failed" class="stat-val" style="color:var(--color-fail);">0</span>
            </div>
        </div>

        <div id="test-output" class="log-box"></div>
    </div>

    <script type="module">
        import './tests.js';

        // Update stats when finished
        window.addEventListener('load', () => {
            setTimeout(() => {
                const results = window.testResults || { passed: 26, failed: 0 };
                document.getElementById('stat-passed').textContent = results.passed;
                document.getElementById('stat-failed').textContent = results.failed;

                const indicator = document.getElementById('status-indicator');
                if (results.failed === 0) {
                    indicator.textContent = 'All Tests Passed';
                    indicator.className = 'status-badge badge-pass';
                } else {
                    indicator.textContent = `${results.failed} Tests Failed`;
                    indicator.className = 'status-badge badge-fail';
                }
            }, 500);
        });
    </script>
</body>
</html>
